<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .botao {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            transition: background-color 0.4s ease
        }

        .botao:hover {
            background:green ;
        }
    </style>
</head>
<body>
    <h1>Animação com transition</h1>
    <p class="botao">START</p>
</body>
</html>
